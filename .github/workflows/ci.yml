name: Full Stack CI (Backend & Frontend Production Verification)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

  frontend-ci:
    name: Frontend Production Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Optimized React Web Application
        working-directory: frontend
        run: npm run build

      - name: Upload Production Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Education-Web-Build
          path: frontend/build/
          if-no-files-found: error
