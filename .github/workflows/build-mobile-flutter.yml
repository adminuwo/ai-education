name: Build Flutter Mobile App (16 KB Page Aligned & iOS IPA)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - 'android'
          - 'ios'
          - 'all'
      profile:
        description: 'Build Profile (preview = Installable APK/IPA, production = Play Store AAB/Release IPA, development = Debug)'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'production'
          - 'development'

jobs:
  build-android:
    name: Build Android Flutter (${{ inputs.profile }})
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2* 2>/dev/null || true
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter 3.24+ (Official 16 KB Page Support)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Android NDK r27b (16 KB Page Support)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Configure Flutter Native Dependencies
        working-directory: mobile-flutter
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.convee.education --project-name ai_education --platforms android
          fi
          flutter pub get
          echo ">>> Generating AI Education branded launcher icons..."
          dart run flutter_launcher_icons
          echo ">>> Generating AI Education dark splash screen..."
          dart run flutter_native_splash:create
          echo ">>> Setting official app name in AndroidManifest..."
          sed -i 's/android:label="ai_education"/android:label="AI Education"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="convee_education"/android:label="AI Education"/g' android/app/src/main/AndroidManifest.xml
          echo ">>> Injecting INTERNET and ACCESS_NETWORK_STATE permissions into AndroidManifest..."
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()

          perms = """    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n"""
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", perms + "    <application", 1)

          if "android:usesCleartextTraffic" not in content:
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)

          with open(path, "w") as f:
              f.write(content)
          print(">>> Injected INTERNET and ACCESS_NETWORK_STATE permissions successfully into AndroidManifest.xml")
          '

      - name: Build Android Package
        working-directory: mobile-flutter
        run: |
          PROFILE="${{ inputs.profile }}"
          echo ">>> Building Android package with profile: $PROFILE (16 KB Aligned)..."
          if [ "$PROFILE" = "production" ]; then
            echo ">>> Building Production Release AAB for Google Play Store..."
            flutter build appbundle --release -v
          elif [ "$PROFILE" = "development" ]; then
            echo ">>> Building Development Debug APK..."
            flutter build apk --debug -v
          else
            echo ">>> Building Standalone Preview Release APK for Testing..."
            flutter build apk --release -v
          fi

      - name: Verify 16 KB Page Alignment
        working-directory: mobile-flutter
        run: |
          echo ">>> Verifying 16 KB page alignment on generated Flutter APK..."
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            mkdir -p /tmp/apk_inspect
            unzip -q "$APK_FILE" -d /tmp/apk_inspect
            echo "Inspecting ELF alignment on bundled native libraries:"
            find /tmp/apk_inspect/lib -name "*.so" | head -n 10 | while read so_file; do
              echo "Checking $so_file:"
              objdump -p "$so_file" | grep -i "align" | head -n 2 || true
            done
            rm -rf /tmp/apk_inspect
          fi

      - name: Upload Flutter Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIEducation-Flutter-Android-${{ inputs.profile }}
          path: |
            mobile-flutter/build/app/outputs/flutter-apk/**/*.apk
            mobile-flutter/build/app/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA Flutter (${{ inputs.profile }})
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24+
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Native iOS Platform
        working-directory: mobile-flutter
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --org com.convee.education --project-name ai_education --platforms ios
          fi
          flutter pub get
          cd ios && pod install

      - name: Build iOS Application Package
        working-directory: mobile-flutter
        run: |
          PROFILE="${{ inputs.profile }}"
          echo ">>> Building iOS application with profile: $PROFILE..."
          if [ "$PROFILE" = "development" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build ios --release --no-codesign
          fi

      - name: Package IPA
        working-directory: mobile-flutter
        run: |
          PROFILE="${{ inputs.profile }}"
          echo ">>> Packaging Runner.app into AIEducation-Flutter-${PROFILE}.ipa..."
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AIEducation-Flutter-${PROFILE}.ipa Payload
          mkdir -p dist
          mv AIEducation-Flutter-${PROFILE}.ipa dist/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIEducation-Flutter-iOS-${{ inputs.profile }}
          path: mobile-flutter/dist/AIEducation-Flutter-${{ inputs.profile }}.ipa
          if-no-files-found: error
